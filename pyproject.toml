[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-scan"
version = "0.1.0"
description = "PyQt6 desktop application for Thai/Lao licence plate scanning"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7,<7",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "psycopg[binary]>=3.2,<4",
    "ultralytics>=8.3,<9",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
ocr = [
    "torch>=2.2",
    "paddleocr>=2.8",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
car-scan = "car_scan.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
