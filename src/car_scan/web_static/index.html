<!DOCTYPE html>
<html lang="th" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car Scan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Lao:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="/static/tailwind-theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/app.css?v=ops32" />
  </head>
  <body class="m-0 h-full bg-desk text-ink">
    <div class="app grid min-h-full grid-cols-[196px_minmax(0,1fr)] max-[980px]:grid-cols-1">
      <aside class="rail flex flex-col border-r border-steel bg-rail py-6 text-slate-400 max-[980px]:flex-row max-[980px]:items-center max-[980px]:gap-2 max-[980px]:p-3">
        <div class="brand">
          <div class="brand-mark" aria-label="OneVision"><span class="brand-one">One</span><span class="brand-tech">Vision</span></div>
          <div class="brand-product">Car Scan</div>
        </div>
        <nav class="modes flex flex-col gap-1 max-[980px]:flex-row" aria-label="scan modes">
          <button type="button" class="mode border-0 border-l-[3px] border-l-transparent bg-transparent px-3 py-3.5 text-left font-semibold hover:bg-white/5 hover:text-white aria-pressed:border-l-enamel aria-pressed:bg-enamel/20 aria-pressed:text-white" data-mode="image" aria-pressed="true"></button>
          <button type="button" class="mode border-0 border-l-[3px] border-l-transparent bg-transparent px-3 py-3.5 text-left font-semibold hover:bg-white/5 hover:text-white aria-pressed:border-l-enamel aria-pressed:bg-enamel/20 aria-pressed:text-white" data-mode="video" aria-pressed="false"></button>
          <button type="button" class="mode border-0 border-l-[3px] border-l-transparent bg-transparent px-3 py-3.5 text-left font-semibold hover:bg-white/5 hover:text-white aria-pressed:border-l-enamel aria-pressed:bg-enamel/20 aria-pressed:text-white" data-mode="camera" aria-pressed="false"></button>
          <button type="button" class="mode log mt-2.5 border-0 border-l-[3px] border-l-transparent bg-transparent px-3 py-3.5 text-left font-semibold hover:bg-white/5 hover:text-white aria-pressed:border-l-enamel aria-pressed:bg-enamel/20 aria-pressed:text-white" id="camerasBtn" hidden></button>
          <button type="button" class="mode log border-0 border-l-[3px] border-l-transparent bg-transparent px-3 py-3.5 text-left font-semibold hover:bg-white/5 hover:text-white aria-pressed:border-l-enamel aria-pressed:bg-enamel/20 aria-pressed:text-white" id="historyBtn" hidden></button>
          <button type="button" class="mode log border-0 border-l-[3px] border-l-transparent bg-transparent px-3 py-3.5 text-left font-semibold hover:bg-white/5 hover:text-white aria-pressed:border-l-enamel aria-pressed:bg-enamel/20 aria-pressed:text-white" id="reportBtn"></button>
          <button type="button" class="mode log users hidden border-0 border-l-[3px] border-l-transparent bg-transparent px-3 py-3.5 text-left font-semibold hover:bg-white/5 hover:text-white aria-pressed:border-l-enamel aria-pressed:bg-enamel/20 aria-pressed:text-white" id="usersBtn" hidden></button>
        </nav>
        <div class="langs mt-auto flex flex-col gap-1 px-2.5 max-[980px]:ml-auto max-[980px]:mt-0 max-[980px]:flex-row" role="group" aria-label="language">
          <button type="button" data-lang="th" aria-pressed="true" class="cursor-pointer rounded-gate border border-steel px-2 py-1.5 text-slate-400 aria-pressed:border-enamel aria-pressed:bg-enamel aria-pressed:text-white">ไทย</button>
          <button type="button" data-lang="lo" aria-pressed="false" class="cursor-pointer rounded-gate border border-steel px-2 py-1.5 text-slate-400 aria-pressed:border-enamel aria-pressed:bg-enamel aria-pressed:text-white">ລາວ</button>
          <button type="button" data-lang="en" aria-pressed="false" class="cursor-pointer rounded-gate border border-steel px-2 py-1.5 text-slate-400 aria-pressed:border-enamel aria-pressed:bg-enamel aria-pressed:text-white">EN</button>
        </div>
      </aside>

      <div class="workspace flex min-w-0 flex-col">
        <header class="topbar flex items-center justify-between gap-3 px-[18px] pb-2 pt-3.5">
          <div>
            <h1 id="modeTitle" class="m-0 text-xl font-bold"></h1>
            <p id="modeHint" class="hint m-1 text-muted ui-removed" hidden></p>
          </div>
          <div class="topbar-actions flex flex-wrap items-center justify-end gap-2">
            <span id="fileChip" class="chip rounded-gate border border-line bg-panel px-2.5 py-1.5 font-semibold"></span>
            <span id="userChip" class="chip muted rounded-gate border border-line bg-panel px-2.5 py-1.5 font-normal text-muted"></span>
            <button type="button" id="passwordBtn" class="btn ghost"></button>
            <button type="button" id="logoutBtn" class="btn steel"></button>
          </div>
        </header>

        <section class="toolbar flex flex-wrap items-center gap-3 px-[18px] pb-2.5" aria-label="actions">
          <label class="btn steel">
            <input id="fileInput" type="file" hidden />
            <span id="openLabel"></span>
          </label>
          <button type="button" id="scanBtn" class="btn enamel ui-removed" disabled hidden></button>
          <button type="button" id="stopBtn" class="btn signal ui-removed" disabled hidden></button>
          <button type="button" id="saveBtn" class="btn steel ui-removed" disabled hidden></button>
          <label class="check flex items-center gap-1.5">
            <input id="roiEnabled" type="checkbox" checked />
            <span id="roiEnabledLabel"></span>
          </label>
          <span class="spacer flex-1"></span>
          <span id="healthChip" class="chip muted rounded-gate border border-line bg-panel px-2.5 py-1.5 font-normal text-muted"></span>
          <div class="compute-bar">
            <label class="compute-label" for="computeMode">
              <span id="computeLabel"></span>
              <select id="computeMode" class="rounded-gate border border-line bg-[#fbfcfd] px-1.5 py-1" title="สลับ GPU/CPU ได้ทันที ไม่ต้องรีสตาร์ท">
                <option value="auto"></option>
                <option value="gpu"></option>
                <option value="cpu"></option>
                <option value="hybrid"></option>
              </select>
            </label>
            <span id="gpuChip" class="chip muted rounded-gate border border-line bg-panel px-2.5 py-1.5 font-normal text-muted"></span>
          </div>
          <button type="button" id="camerasToolbarBtn" class="btn ghost hidden ui-removed" hidden></button>
        </section>

        <div class="stage grid min-h-0 flex-1 grid-cols-[minmax(0,1.45fr)_minmax(280px,0.9fr)] gap-3 px-[18px] max-[980px]:grid-cols-1">
          <section class="preview-col flex min-h-0 flex-col">
            <div class="panel mb-3 flex min-h-0 flex-col rounded-gate border border-line bg-panel p-2.5" id="roiPanel">
              <div class="panel-head mb-2 font-bold" id="roiHead"></div>
              <div class="roi-row flex flex-wrap items-center gap-2">
                <label><span id="shapeLabel"></span>
                  <select id="roiShape" class="rounded-gate border border-line bg-[#fbfcfd] px-1.5 py-1">
                    <option value="rectangle"></option>
                    <option value="circle"></option>
                    <option value="ellipse"></option>
                    <option value="lane">เลน + เส้น Trigger</option>
                  </select>
                </label>
                <button type="button" id="roiFull" class="btn ghost"></button>
                <button type="button" id="roiCenter" class="btn ghost"></button>
              </div>
              <p id="roiTip" class="tip mt-2 text-[13px] text-muted"></p>
            </div>
            <div class="camera-workspace">
              <div id="cameraSelector" class="panel camera-selector hidden rounded-gate border border-line bg-panel p-2.5" hidden>
                <div class="panel-head-row camera-selector-head">
                  <div>
                    <div class="panel-head mb-0 font-bold" id="cameraSelectorHead"></div>
                    <p class="tip m-0 text-[13px] text-muted" id="cameraSelectorHint"></p>
                  </div>
                  <span class="panel-meta" id="cameraSelectorMeta"></span>
                </div>
                <div class="camera-selector-filters">
                  <input id="cameraSearch" type="search" autocomplete="off" />
                  <select id="cameraDirectionFilter" aria-label="Filter cameras by direction">
                    <option value="all"></option>
                    <option value="IN"></option>
                    <option value="OUT"></option>
                    <option value="UNASSIGNED"></option>
                  </select>
                </div>
                <div class="camera-selector-actions">
                  <button type="button" id="cameraSelectAll" class="btn ghost"></button>
                  <button type="button" id="cameraClearAll" class="btn ghost"></button>
                </div>
                <div id="cameraSelectorList" class="camera-selector-list"></div>
              </div>
              <div class="panel preview-panel flex min-h-0 flex-1 flex-col rounded-gate border border-line bg-panel p-2.5">
                <div class="panel-head-row camera-wall-head">
                  <div class="panel-head mb-0 font-bold" id="previewHead"></div>
                  <span class="panel-meta" id="cameraWallMeta"></span>
                  <button type="button" id="cameraFocusBtn" class="btn ghost camera-focus-btn hidden" hidden></button>
                  <div id="cameraWallPager" class="camera-wall-pager hidden" hidden>
                    <button type="button" id="cameraWallPrev" class="btn ghost"></button>
                    <span id="cameraWallPageLabel"></span>
                    <button type="button" id="cameraWallNext" class="btn ghost"></button>
                  </div>
                </div>
                <div id="dropZone" class="well relative min-h-0 flex-1 overflow-hidden border border-[#0b1014] bg-well">
                  <canvas id="view"></canvas>
                  <div id="cameraGrid" class="camera-grid hidden" hidden></div>
                  <div id="cameraFocusPicker" class="camera-focus-picker" hidden></div>
                  <p id="emptyHint" class="empty"></p>
                </div>
              </div>
            </div>
          </section>

          <section class="result-col flex min-h-0 flex-col">
            <div class="panel plate-panel mb-3 flex min-h-0 flex-col rounded-gate border border-line bg-panel p-2.5">
              <div class="panel-head mb-2 font-bold" id="plateHead"></div>
              <div id="plateFace" class="plate-face unknown">
                <span id="plateCountry">LICENCE PLATE</span>
                <strong id="plateNumber"></strong>
                <em id="plateProvince"></em>
              </div>
            </div>
            <div class="panel detail-panel mb-3 flex min-h-0 flex-col rounded-gate border border-line bg-panel p-2.5">
              <div class="panel-head mb-2 font-bold" id="detailHead"></div>
              <dl id="details" class="details"></dl>
            </div>
            <div class="panel result-table-panel grow mb-3 flex min-h-0 flex-1 flex-col rounded-gate border border-line bg-panel p-2.5">
              <div class="panel-head-row ui-removed" hidden>
                <div class="panel-head mb-0 font-bold" id="tableHead"></div>
                <span class="panel-meta" id="tableMeta"></span>
              </div>
              <div class="table-wrap flex-1 overflow-auto ui-removed" hidden>
                <table class="result-table">
                  <thead>
                    <tr id="tableHeader"></tr>
                  </thead>
                  <tbody id="tableBody"></tbody>
                </table>
              </div>
              <div class="result-crops">
                <div class="panel-head-row">
                  <div class="panel-head mb-0 font-bold" id="cropHead"></div>
                  <span class="panel-meta" id="cropMeta"></span>
                </div>
                <div id="crops" class="crops"></div>
              </div>
            </div>
          </section>
        </div>

        <footer class="status mt-auto flex items-center justify-between gap-3 bg-rail px-[18px] py-2 text-[#c5cdd4]">
          <span id="statusText"></span>
          <span id="plateCount"></span>
        </footer>
      </div>
    </div>
    <div id="camerasPanel" class="users-panel hidden fixed inset-0 z-20 grid place-items-center bg-rail/45 p-[18px]" hidden>
      <div class="users-card camera-setup-card max-h-[min(90vh,820px)] w-[min(760px,100%)] overflow-auto rounded-gate border border-line bg-panel p-4">
        <div class="flex flex-wrap items-start justify-between gap-2">
          <div>
            <div class="panel-head mb-0 font-bold" id="workerHead"></div>
            <p class="hint m-1 text-muted" id="workerHint"></p>
          </div>
          <span class="flex flex-wrap items-center gap-2">
            <span id="cameraStorageStatus" class="tip m-0 text-[13px] text-muted"></span>
            <span id="cameraLiveStatus" class="tip m-0 text-[13px] text-muted"></span>
          </span>
        </div>
        <div class="camera-setup">
          <label><span id="ipCameraLabel"></span>
            <select id="ipCameraSelect" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2"></select>
          </label>
          <div class="camera-setup-row">
            <button type="button" id="ipCameraRemoveBtn" class="btn ghost"></button>
            <button type="button" id="localCameraBtn" class="btn enamel"></button>
          </div>
          <label><span id="ipCameraAddLabel"></span>
            <input id="ipCameraUrl" type="text" autocomplete="off" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
          <label><span id="ipCameraNameLabel"></span>
            <input id="ipCameraName" type="text" maxlength="80" autocomplete="off" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
          <div class="camera-setup-grid">
            <label><span id="ipCameraUserLabel"></span>
              <input id="ipCameraUser" type="text" autocomplete="off" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
            </label>
            <label><span id="ipCameraPasswordLabel"></span>
              <input id="ipCameraPassword" type="password" autocomplete="new-password" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
            </label>
          </div>
          <label><span id="ipCameraPathLabel"></span>
            <input id="ipCameraPath" type="text" autocomplete="off" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
          <div class="camera-setup-row">
            <button type="button" id="ipCameraAddBtn" class="btn steel"></button>
          </div>
          <div class="camera-setup-grid">
            <label><span id="ipCameraEditNameLabel"></span>
              <input id="ipCameraEditName" type="text" maxlength="80" autocomplete="off" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
            </label>
            <label><span id="ipCameraEditUrlLabel"></span>
              <input id="ipCameraEditUrl" type="text" autocomplete="off" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
            </label>
          </div>
          <div class="camera-setup-row">
            <button type="button" id="ipCameraSaveBtn" class="btn enamel"></button>
          </div>
          <div class="camera-setup-row">
            <button type="button" id="camStart" class="btn steel"></button>
            <button type="button" id="camSnap" class="btn enamel" disabled></button>
            <button type="button" id="camRecord" class="btn steel" disabled></button>
            <button type="button" id="camStopRec" class="btn signal" disabled></button>
          </div>
        </div>
        <button type="button" id="camerasClose" class="btn ghost"></button>
      </div>
    </div>
    <div id="usersPanel" class="users-panel hidden fixed inset-0 z-20 grid place-items-center bg-rail/45 p-[18px]" hidden>
      <div class="users-card roster-card max-h-[min(90vh,820px)] w-[min(920px,100%)] overflow-auto rounded-gate border border-line bg-panel p-4">
        <div class="panel-head mb-2 font-bold" id="usersHead"></div>
        <p class="hint m-1 text-muted" id="usersHint"></p>
        <form id="userForm" class="user-form">
          <label><span id="userNameLabel"></span>
            <input id="newUsername" type="text" autocomplete="off" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
          <label><span id="userDisplayLabel"></span>
            <input id="newDisplayName" type="text" autocomplete="off" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
          <label><span id="userRoleLabel"></span>
            <select id="newRole" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2">
              <option value="operator"></option>
              <option value="viewer"></option>
              <option value="admin"></option>
              <option value="superuser"></option>
            </select>
          </label>
          <label><span id="userPasswordLabel"></span>
            <input id="newPassword" type="password" autocomplete="new-password" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
          <div class="user-form-actions">
            <button type="submit" class="btn enamel" id="userCreateBtn"></button>
            <button type="button" class="btn ghost hidden" id="userCancelEdit"></button>
          </div>
        </form>
        <p id="usersError" class="gate-error" hidden></p>
        <div class="table-wrap roster-table">
          <table>
            <thead>
              <tr id="usersHeader"></tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
        <button type="button" id="usersClose" class="btn ghost"></button>
      </div>
    </div>
    <div id="historyPanel" class="users-panel hidden fixed inset-0 z-20 grid place-items-center bg-rail/45 p-[18px]" hidden>
      <div class="users-card ledger-card max-h-[min(90vh,860px)] w-[min(1180px,100%)] overflow-auto rounded-gate border border-line bg-panel p-4">
        <div class="panel-head mb-2 font-bold" id="historyHead"></div>
        <p class="hint m-1 text-muted" id="historyHint"></p>
        <div class="ledger-filters">
          <label><span id="historyDateLabel"></span>
            <input id="historyDate" type="date" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
          <label><span id="historyOperatorLabel"></span>
            <select id="historyOperator" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2">
              <option value=""></option>
            </select>
          </label>
          <label class="ledger-search"><span id="historyQueryLabel"></span>
            <input id="historyQuery" type="search" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
        </div>
        <p id="historyError" class="gate-error" hidden></p>
        <p id="historyEmpty" class="hint text-muted" hidden></p>
        <div class="ledger-layout">
          <div id="historyBody" class="ledger-body"></div>
          <aside id="historySlip" class="ledger-slip hidden" hidden>
            <div class="panel-head mb-2 font-bold" id="historySlipHead"></div>
            <p id="historySlipMeta" class="hint text-muted"></p>
            <div class="slip-photos">
              <figure>
                <img id="historySlipImage" alt="" hidden />
                <figcaption id="historySlipVehicleCap"></figcaption>
              </figure>
              <figure>
                <img id="historySlipCrop" alt="" hidden />
                <figcaption id="historySlipCropCap"></figcaption>
              </figure>
            </div>
            <p id="historySlipNoImage" class="hint text-muted" hidden></p>
            <dl id="historySlipDetails" class="details slip-details"></dl>
            <button type="button" id="historySlipClose" class="btn ghost"></button>
          </aside>
        </div>
        <div class="ledger-actions no-print">
          <button type="button" id="historyPrint" class="btn steel"></button>
          <button type="button" id="historyClose" class="btn ghost"></button>
        </div>
      </div>
    </div>
    <div id="reportPanel" class="users-panel hidden fixed inset-0 z-20 grid place-items-center bg-rail/45 p-[18px]" hidden>
      <div class="users-card report-card max-h-[min(92vh,900px)] w-[min(1180px,100%)] overflow-auto rounded-gate border border-line bg-panel p-4">
        <div class="panel-head mb-2 font-bold" id="reportHead"></div>
        <p class="hint m-1 text-muted" id="reportHint"></p>
        <div class="ledger-filters report-filters">
          <label><span id="reportFromLabel"></span>
            <input id="reportFrom" type="date" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
          <label><span id="reportToLabel"></span>
            <input id="reportTo" type="date" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
          <label><span id="reportOperatorLabel"></span>
            <select id="reportOperator" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2">
              <option value=""></option>
            </select>
          </label>
          <div class="report-presets no-print">
            <button type="button" class="btn ghost" id="reportToday"></button>
            <button type="button" class="btn ghost" id="reportWeek"></button>
            <button type="button" class="btn ghost" id="reportMonth"></button>
          </div>
        </div>
        <p id="reportError" class="gate-error" hidden></p>
        <p id="reportEmpty" class="hint text-muted" hidden></p>
        <div id="reportBody" class="report-body"></div>
        <div class="ledger-actions no-print">
          <button type="button" id="reportPrint" class="btn steel"></button>
          <button type="button" id="reportCsv" class="btn steel"></button>
          <button type="button" id="reportClose" class="btn ghost"></button>
        </div>
      </div>
    </div>
    <div id="passwordPanel" class="users-panel hidden fixed inset-0 z-20 grid place-items-center bg-rail/45 p-[18px]" hidden>
      <div class="users-card password-card w-[min(420px,100%)] overflow-auto rounded-gate border border-line bg-panel p-4">
        <div class="panel-head mb-2 font-bold" id="passwordHead"></div>
        <form id="passwordForm" class="password-form">
          <label><span id="passwordCurrentLabel"></span>
            <input id="passwordCurrent" type="password" autocomplete="current-password" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
          <label><span id="passwordNewLabel"></span>
            <input id="passwordNew" type="password" autocomplete="new-password" class="rounded-gate border border-line bg-[#fbfcfd] px-2.5 py-2" />
          </label>
          <p id="passwordError" class="gate-error" hidden></p>
          <p id="passwordOk" class="hint text-muted" hidden></p>
          <button type="submit" class="btn enamel" id="passwordSave"></button>
        </form>
        <button type="button" id="passwordClose" class="btn ghost"></button>
      </div>
    </div>
    <script src="/static/app.js?v=roi-trigger-crossing-20261009"></script>
  </body>
</html>
