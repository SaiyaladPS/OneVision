Global:
  use_gpu: false
  epoch_num: 30
  log_smooth_window: 10
  print_batch_step: 20
  save_model_dir: "D:/project/car-scan/runs/ocr/plate_rec_lao_detail"
  save_epoch_step: 1
  eval_batch_step: [0, 25]
  cal_metric_during_train: true
  pretrained_model: "D:/project/car-scan/model/paddleocr_train2/output/plate_rec_small/best_accuracy"
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  character_dict_path: "D:/project/car-scan/model/paddleocr_train2/plate_lao_detail_dict.txt"
  max_text_length: 20
  infer_mode: false
  use_space_char: false
  save_res_path: "D:/project/car-scan/runs/ocr/plate_rec_lao_detail/predicts.txt"

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    learning_rate: 0.0003
  regularizer:
    name: L2
    factor: 0.00001

Architecture:
  model_type: rec
  algorithm: Rosetta
  Transform:
  Backbone:
    name: MobileNetV3
    scale: 0.5
    model_name: small
  Neck:
    name: SequenceEncoder
    encoder_type: reshape
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: "D:/project/car-scan/model/paddleocr_train2/train_data"
    label_file_list:
    - "D:/project/car-scan/model/paddleocr_train2/train_data/rec_lao_full/detail/train_list.txt"
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - CTCLabelEncode:
    - RecResizeImg:
        image_shape: [3, 32, 160]
    - KeepKeys:
        keep_keys: [image, label, length]
  loader:
    shuffle: true
    batch_size_per_card: 64
    drop_last: true
    num_workers: 0

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: "D:/project/car-scan/model/paddleocr_train2/train_data"
    label_file_list:
    - "D:/project/car-scan/model/paddleocr_train2/train_data/rec_lao_full/detail/val_list.txt"
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - CTCLabelEncode:
    - RecResizeImg:
        image_shape: [3, 32, 160]
    - KeepKeys:
        keep_keys: [image, label, length]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 0
