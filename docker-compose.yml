services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: car-scan-web:local
    env_file:
      - .env
    ports:
      - "${CAR_SCAN_WEB_PORT:-8000}:8000"
    environment:
      CAR_SCAN_ROOT: /app
      CAR_SCAN_OUTPUT_DIR: /app/scan/data
      CAR_SCAN_WEB_HOST: 0.0.0.0
      CAR_SCAN_WEB_PORT: "8000"
      CAR_SCAN_WEB_MAX_UPLOAD_MB: "${CAR_SCAN_WEB_MAX_UPLOAD_MB:-4096}"
      CAR_SCAN_PIPELINE_CONFIG: /app/pipeline_config.yaml
      DATABASE_URL: "${DATABASE_URL:-${CAR_SCAN_DATABASE_URL:-}}"
      CAR_SCAN_DATABASE_URL: "${DATABASE_URL:-${CAR_SCAN_DATABASE_URL:-}}"
      CAR_SCAN_ADMIN_USERNAME: "${CAR_SCAN_ADMIN_USERNAME:-admin}"
      CAR_SCAN_ADMIN_PASSWORD: "${CAR_SCAN_ADMIN_PASSWORD:-changeme}"
      CAR_SCAN_AUTH_SECRET: "${CAR_SCAN_AUTH_SECRET:-}"
      STORAGE_SERVICE_BASE_URL: "${STORAGE_SERVICE_BASE_URL:-http://10.0.200.205:8080}"
      STORAGE_SERVICE_PROJECT_CODE: "${STORAGE_SERVICE_PROJECT_CODE:-onevision}"
      STORAGE_SERVICE_API_TOKEN: "${STORAGE_SERVICE_API_TOKEN:-}"
      ONEVISION_REPORT_IMAGE_URL: "${ONEVISION_REPORT_IMAGE_URL:-http://10.0.200.205:3008/api/plates/image}"
      ONEVISION_REPORT_DATA_URL: "${ONEVISION_REPORT_DATA_URL:-http://10.0.200.205:3008/api/dataset/storage}"
      CAR_SCAN_TRAIN_WORKERS: "${CAR_SCAN_TRAIN_WORKERS:-[]}"
    volumes:
      - ./scan/data:/app/scan/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1gb"
    restart: unless-stopped
